name: Production health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check revQR readiness
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 2 --retry-delay 5 --retry-all-errors \
            --max-time 15 https://revqr.tech/health/ready)"
          python -c 'import json,sys; body=json.loads(sys.argv[1]); assert body.get("status") == "ready", body' "$response"

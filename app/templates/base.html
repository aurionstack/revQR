<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}revQR — AI-powered Google review generator for SMBs{% endblock %}" />
  <title>{% block title %}revQR{% endblock %}</title>


  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="/static/css/style.css" />

  <!-- Brand color override (injected by Jinja2 when business data is available) -->
  {% if brand_color is defined and brand_color %}
  <style>
    :root {
      --accent: {{ brand_color }};
      --accent-deep: {{ brand_color_deep | default(brand_color) }};
      --accent-soft: {{ brand_color_soft | default('#DCE6ED') }};
    }
  </style>
  {% endif %}

  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}page-center{% endblock %}">

  {% block content %}{% endblock %}

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>

  <!-- App JS -->
  <script src="/static/js/app.js"></script>

  {% block scripts %}{% endblock %}
</body>
</html>

<!-- HTMX partial: Private note form -->
<!-- Loaded when user clicks "Also send a private note" -->
<section class="screen" id="screen-note">
  <h2 class="q">A private note for {{ business_name }}</h2>

  <form
    hx-post="/review/{{ slug }}/feedback"
    hx-target="#review-stage"
    hx-swap="innerHTML"
    id="privateNoteForm"
  >
    <input type="hidden" name="scan_id" value="{{ scan_id }}" />
    <input type="hidden" name="review_id" value="{{ review_id }}" />
    <input type="hidden" name="rating" value="{{ rating }}" />

    <textarea
      id="privateNoteInput"
      name="message"
      placeholder="Only the business sees this — say as much as you like."
      rows="5"
      required
      minlength="1"
      maxlength="2000"
    ></textarea>

    <p class="hint">This doesn't replace your Google review — it goes straight to the owner, in addition.</p>

    <div class="continue-row">
      <button type="submit" class="btn btn-primary" id="sendNoteBtn">
        Send privately
      </button>
    </div>
  </form>

  <div class="private-link-row">
    <button
      type="button"
      class="btn-ghost"
      hx-get="/review/{{ slug }}/back-to-review?review_id={{ review_id }}&scan_id={{ scan_id }}&rating={{ rating }}"
      hx-target="#review-stage"
      hx-swap="innerHTML"
    >
      ← Back to my review
    </button>
  </div>
</section>

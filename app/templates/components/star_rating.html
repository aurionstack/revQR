<!-- Reusable star rating component (static display, not interactive) -->
<!-- Usage: {% include "components/star_rating.html" %} with `rating` in context -->
<span class="receipt-rating">
  {% for i in range(1, 6) %}
  <span class="{{ 'star-filled' if i <= rating else 'star-empty' }}">★</span>
  {% endfor %}
</span>

<div class="private-note-box fade-in">
  <h3>Send a private message</h3>
  <p class="hint">This note is visible only to {{ business_name }}.</p>
  <form hx-post="/review/{{ slug }}/private-note" hx-target="#review-stage" hx-swap="innerHTML">
    <input type="hidden" name="scan_id" value="{{ scan_id }}" />
    <input type="hidden" name="review_id" value="{{ review_id }}" />
    <input type="hidden" name="rating" value="{{ rating }}" />
    <textarea name="message" rows="4" maxlength="2000" placeholder="Share details directly with the business owner…" required></textarea>
    <div class="action-row" style="margin-top:12px;">
      <button type="submit" class="btn btn-primary">Send private note</button>
    </div>
  </form>
</div>

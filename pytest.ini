[pytest]
asyncio_mode = auto
markers =
    no_db: test does not require the PostgreSQL test database
asyncio_default_fixture_loop_scope = function
pythonpath = .
env =
    DATABASE_URL_TEST=postgresql+asyncpg://postgres:postgres@localhost:5432/qr_reviews_test
    GEMINI_API_KEY=test_dummy_key
    RAZORPAY_KEY_ID=test_key
    RAZORPAY_KEY_SECRET=test_secret
    JWT_SECRET_KEY=test_jwt_secret_that_is_at_least_32_bytes_long
